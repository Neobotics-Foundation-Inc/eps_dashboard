# EPS Dashboard parameters. Reset or Load on the dashboard re-reads this
# file; Save writes the tuned values back into it.
#
# Learner hyperparameters ((1+1)-ES with the 1/5th success rule). The
# a_up/a_down pair fixes the success rate the search settles at:
# p* = -ln(a_down) / (ln(a_up) - ln(a_down)). Defaults give p* = 0.2.

sigma0: 0.15          # initial mutation size, in normalized units
a_up: 2.24            # sigma growth on success
a_down: 0.82          # sigma shrink on failure
sigma_min: 0.02       # sigma floor
sigma_max: 0.6        # sigma ceiling
speed_step: 0.02      # curriculum step up after confirm_runs wins
speed_backoff: 0.02   # curriculum step down after patience fails
patience: 3           # consecutive fails before backing the speed off
confirm_runs: 2       # consecutive wins before promoting the speed
sigma_kick: 1.5       # sigma bump when the speed promotes (task changed)
speed_floor: 0.12     # curriculum floor; Reset learner returns here
speed_max: 0.35       # hard cap; instructor sets this for the venue
duration_slack: 1.05  # a pass slower than best lap x this scores as slow (rejected)

# The plant: gap follower settings, fixed for the whole session.
max_mps: 4.0          # the car's top speed in m/s; staircase speed x this
                      # is the target the speed loop chases via odometry
width: 70.0           # search this many degrees left and right of the nose
side_weight: 0.0      # score bonus (m per degree) toward the right
lookahead: 10.0        # meters; distances cap here
window: 10.0          # averaging window per ray, degrees

scan_topic: /scan

# Nominal gain vector: the scale that normalizes the search space.
nominal:
  kp: 2.0
  kd: 1.0
  speed_kp: 0.08
  speed_kd: 0.03
